<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Desain Grafis | Reza</title>
    <!-- Menggunakan Google Fonts untuk tipografi yang lebih estetik -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden; /* Mencegah scroll pada halaman pertama */
        }

        /* 1. Background Faded Tema Desain Grafis */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Menggunakan gambar abstrak/kreatif dari Unsplash dengan overlay gradien hitam transparan agar memudar (faded) */
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Container untuk konten dengan animasi masuk (fade in) */
        .content-wrapper {
            z-index: 2;
            padding: 0 20px;
            animation: fadeInUp 1.2s ease-out forwards;
            opacity: 0;
        }

        /* 2. Hero Section: Nama */
        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 2. Hero Section: Tagline */
        .tagline {
            font-size: 1.2rem;
            font-weight: 300;
            color: #cccccc;
            margin-bottom: 45px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* 3. Button Start */
        .start-btn {
            display: inline-block;
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #121212;
            background-color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        /* Efek transisi mulus saat kursor mengenai tombol */
        .start-btn:hover {
            transform: translateY(-4px);
            background-color: #ff4757; /* Aksen warna merah/coral khas portofolio kreatif */
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
        }

        /* Keyframes untuk animasi transisi saat halaman dimuat */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsif untuk layar HP */
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="content-wrapper">
            <h1>Halo, Saya Reza</h1>
            
            <!-- Tagline yang dirancang khusus untuk Desainer Grafis -->
            <p class="tagline">
                Menerjemahkan ide kompleks menjadi visual estetik, fungsional, dan berdampak.
            </p>
            
            <!-- Button untuk menuju halaman selanjutnya -->
            <a href="page2.html" class="start-btn">Start Exploration</a>
        </div>
    </section>

</body>
</html>
